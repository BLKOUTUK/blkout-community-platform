<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA and Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BLKOUT Liberation" />

    <!-- Theme and Visual Styling -->
    <meta name="theme-color" content="#FFD700" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-navbutton-color" content="#FFD700" />

    <!-- Platform Description -->
    <title>BLKOUT_UK — the Black Queer Men's Liberation Collective</title>
    <meta name="description" content="BLKOUT_UK, the Black Queer Men's Liberation Collective — what Black queer men build when we stop waiting. Community-owned, registered as a mutual." />
    <meta name="keywords" content="BLKOUT, Black queer, community, creator sovereignty, democratic governance, trauma-informed, mutual aid, economic justice" />
    <meta name="author" content="BLKOUT Community">

    <!-- Dreamcatcher type stack: Work Sans 900 / Fraunces italic / IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;900&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BLKOUT_UK — the Black Queer Men's Liberation Collective" />
    <meta property="og:description" content="What Black queer men build when we stop waiting. Community-owned, registered as a mutual." />
    <meta property="og:image" content="/blkout-logo.png" />
    <meta property="og:url" content="https://blkoutuk.com" />
    <meta property="og:site_name" content="BLKOUT Community Platform" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BLKOUT_UK — the Black Queer Men's Liberation Collective" />
    <meta name="twitter:description" content="What Black queer men build when we stop waiting." />
    <meta name="twitter:image" content="/blkout-logo.png" />

    <!-- Icons and Manifest -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/blkout-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance and Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Accessibility -->
    <meta name="color-scheme" content="dark light" />

    <!-- Community Values -->
    <meta name="liberation:creator-sovereignty" content="75-percent">
    <meta name="liberation:community-governance" content="democratic">
    <meta name="liberation:trauma-informed" content="true">

    <!-- Instagram Embed Script -->
    <script async src="//www.instagram.com/embed.js"></script>

    <!-- PWA Installation Script -->
    <script>
      // Register service worker for offline capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('🏴‍☠️ BLKOUT Liberation SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('🏴‍☠️ BLKOUT Liberation SW registration failed:', error);
            });
        });
      }

      // PWA install prompt handling
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('🏴‍☠️ BLKOUT Liberation Platform can be installed');
      });
    </script>
    <script defer data-domain="blkoutuk.com" src="https://analytics.blkoutuk.cloud/js/script.js"></script>
  </head>
