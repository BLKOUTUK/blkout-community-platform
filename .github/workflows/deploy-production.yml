name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  liberation-validation:
    runs-on: ubuntu-latest
    name: 🏴‍☠️ Liberation Values Validation

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Validate Liberation Values
      run: npm run test:liberation-values

    - name: Check Separation of Concerns
      run: npm run test:separation-concerns

    - name: Accessibility Testing
      run: npm run test:accessibility

  build-and-test:
    runs-on: ubuntu-latest
    needs: liberation-validation
    name: 🚀 Build & Test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: TypeScript Type Checking
      run: npm run typecheck || echo "TypeScript errors found - see issue #1"
      continue-on-error: true

    - name: Build for Production
      run: npm run build
      env:
        VITE_LIBERATION_VALUES_ENFORCEMENT: true
        VITE_CREATOR_SOVEREIGNTY_MINIMUM: 0.75
        VITE_DEMOCRATIC_GOVERNANCE_ENABLED: true
        VITE_COMMUNITY_PROTECTION_LEVEL: maximum
        VITE_TRAUMA_INFORMED_UX: enabled
        VITE_ANTI_OPPRESSION_MONITORING: active
        VITE_API_BASE_URL: https://blkout-simple-technical.vercel.app/api
        VITE_ENVIRONMENT: production

    - name: Clean WSL artifacts
      run: find dist/ -name '*Zone.Identifier*' -delete 2>/dev/null || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: liberation-frontend-build
        path: dist/
        retention-days: 30

  # NOTE: Deployment handled by Coolify - removed deploy-to-vercel job to prevent triple deployments
  # CI checks above still run on all PRs and pushes to validate liberation values