server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Commons moved to its own subdomain (BLKOUTUK/commons, commons.blkoutuk.com).
    # Map the old report filenames (without 01-/02- prefix) to the new ones,
    # then send everything else under /commons/* to the subdomain root.
    location = /commons/reports/data-capitalism-algorithmic-racism.pdf {
        return 301 https://commons.blkoutuk.com/reports/01-data-capitalism-algorithmic-racism.pdf;
    }
    location = /commons/reports/strategic-roadmap.pdf {
        return 301 https://commons.blkoutuk.com/reports/02-strategic-roadmap.pdf;
    }
    location = /commons {
        return 301 https://commons.blkoutuk.com/;
    }
    # ^~ ensures this prefix wins over the cache-regex location for /commons/*.png etc.
    location ^~ /commons/ {
        rewrite ^/commons/(.*)$ https://commons.blkoutuk.com/$1 permanent;
    }

    # Proxy API calls to ivor-core backend
    location /api/ivor/ {
        proxy_pass https://ivor.blkoutuk.cloud/api/;
        proxy_http_version 1.1;
        proxy_set_header Host ivor.blkoutuk.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
